set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:bpaste:clipboard:ccolour:cstyle:focus:title"


bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind g new-window lazygit



bind-key -r f run-shell "tmux new-window ~/scripts/tmux-sessionizer"
set -sg escape-time 10

set -g status-position top

# Tokyo Night (night).
set -g status-style "bg=#16161E,fg=#737DA8"
set -g window-status-current-style "bg=#292E42,fg=#7AA2F7,bold"
set -g window-status-style "bg=#16161E,fg=#737DA8"
set -g window-status-activity-style "fg=#E0AF68"
set -g window-status-bell-style "fg=#F7768E,bold"
set -g pane-border-style "fg=#292E42"
set -g pane-active-border-style "fg=#7AA2F7"
set -g message-style "bg=#16161E,fg=#C0CAF5"
set -g message-command-style "bg=#16161E,fg=#7DCFFF"
set -g mode-style "bg=#283457,fg=#C0CAF5"
set -g window-style "bg=#1A1B26,fg=#C0CAF5"
set -g window-active-style "bg=#1A1B26,fg=#C0CAF5"
set -g status-left "#S  "
set -g status-left-style "fg=#9ECE6A,bold"
set -g status-left-length 30
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator " "

# prefix + Ctrl-L / Ctrl-K: clear screen / kill line (plain Ctrl-hjkl now move panes)
bind C-l send-keys C-l
bind C-k send-keys C-k

# Plugins: declarations first, the TPM run line must stay LAST
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.tmux/plugins/tpm/tpm'
