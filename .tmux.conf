set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind g new-window lazygit

set -g @plugin 'tmux-plugins/tpm'


run '~/.tmux/plugins/tpm/tpm'
bind-key -r f run-shell "tmux new-window ~/scripts/tmux-sessionizer"
set -sg escape-time 10
set -g terminal-features "tmux-256color:bpaste:ccolour:clipboard:cstyle:focus:margins:rectfill:title"
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status-position top
set -g status-position top

# tokyonight colors, matching nvim/starship
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g window-status-current-style "fg=#7aa2f7,bold"
set -g window-status-style "fg=#565f89"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#c0caf5"
