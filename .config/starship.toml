add_newline = false
format = """[ibrakhim@pc:](#7DCFFF)$directory$git_branch${custom.git_dirty}
$character"""

[directory]
format = '[$path]($style)'
style = '#7AA2F7'
truncation_length = 0
truncate_to_repo = false
home_symbol = '~'

[git_branch]
format = ' [$branch]($style)'
style = '#BB9AF7'
symbol = ''

[custom.git_dirty]
description = 'One marker for any uncommitted changes'
require_repo = true
when = 'test -n "$(git status --porcelain --untracked-files=normal 2>/dev/null)"'
command = "printf '*'"
shell = ['sh']
format = ' [$output]($style)'
style = '#E0AF68'

[character]
format = '$symbol '
success_symbol = '[\$](#9ECE6A)'
error_symbol = '[\$](#F7768E)'
vimcmd_symbol = '[\$](#9ECE6A)'
