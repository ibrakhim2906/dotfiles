add_newline = false
format = """[ibrakhim@pc:](#4FC1FF)$directory$git_branch${custom.git_dirty}
$character"""

[directory]
format = '[$path]($style)'
style = '#569CD6'
truncation_length = 0
truncate_to_repo = false
home_symbol = '~'

[git_branch]
format = ' [$branch]($style)'
style = '#C586C0'
symbol = ''

[custom.git_dirty]
description = 'One marker for any uncommitted changes'
require_repo = true
when = 'test -n "$(git status --porcelain --untracked-files=normal 2>/dev/null)"'
command = "printf '*'"
shell = ['sh']
format = ' [$output]($style)'
style = '#D7BA7D'

[character]
format = '$symbol '
success_symbol = '[\$](#4EC9B0)'
error_symbol = '[\$](#F44747)'
vimcmd_symbol = '[\$](#4EC9B0)'
